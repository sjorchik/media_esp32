; Медіамодуль ESP32-WROOM-32. Версії зафіксовано.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 921600
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.f_cpu = 240000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    ; Для тимчасового ЦАП UDA1334A (MUTE активний HIGH) розкоментуй:
     -DDAC_MUTE_ACTIVE_HIGH=1
    ; SdFat: імена файлів у UTF-8 (без цього не-ASCII спотворюється)
    -DUSE_UTF8_LONG_NAMES=1
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.10
    greiman/SdFat@2.2.3
monitor_echo = yes
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_eol = LF
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Isrc
build_src_filter = -<*> +<proto/frame.cpp> +<media/id3.cpp> +<media/shuffle.cpp>
test_build_src = yes


